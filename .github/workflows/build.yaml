name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      - name: Format with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check"

  py-pyright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.15"]
    env:
      # without this, uv picks the version in .python-version (3.13), not the
      # matrix one
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # pinned so the action does not try to infer a version from
          # pyproject.toml, where the marker-gated `uv` in the [hawk] extra
          # parses as ">=0.5;" and fails outright
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run pyright
        run: uv run pyright

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.15"]
    env:
      # without this, uv picks the version in .python-version (3.13), not the
      # matrix one
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # pinned so the action does not try to infer a version from
          # pyproject.toml, where the marker-gated `uv` in the [hawk] extra
          # parses as ">=0.5;" and fails outright
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        # network tests read a hawk config, which shells out to `uv pip install`
        # against a git-pinned inspect-ai. Too slow and too external for CI; see
        # the `network` marker in pyproject.toml.
        run: uv run pytest -m "not network"

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.15"]
    env:
      # without this, uv picks the version in .python-version (3.13), not the
      # matrix one
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # pinned so the action does not try to infer a version from
          # pyproject.toml, where the marker-gated `uv` in the [hawk] extra
          # parses as ">=0.5;" and fails outright
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Build package
        run: uv build
      - name: Verify package
        run: |
          uv run --with dist/*.whl python -c "import inspect_steward; print('Package imported successfully')"
