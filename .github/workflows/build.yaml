name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v3
      - name: Format with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  py-pyright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # pinned so the action does not try to infer a version from
          # pyproject.toml, where the marker-gated `uv` in the [hawk] extra
          # parses as ">=0.5;" and fails outright
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run pyright
        run: uv run pyright

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # pinned so the action does not try to infer a version from
          # pyproject.toml, where the marker-gated `uv` in the [hawk] extra
          # parses as ">=0.5;" and fails outright
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        # network tests read a hawk config, which shells out to `uv pip install`
        # against a git-pinned inspect-ai. Too slow and too external for CI; see
        # the `network` marker in pyproject.toml.
        run: uv run pytest -m "not network"

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # pinned so the action does not try to infer a version from
          # pyproject.toml, where the marker-gated `uv` in the [hawk] extra
          # parses as ">=0.5;" and fails outright
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Build package
        run: uv build
      - name: Verify package
        run: |
          uv run --with dist/*.whl python -c "import inspect_steward; print('Package imported successfully')"
