name: Publish Package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm PyPI publication'
        required: true
        type: string

jobs:
  # The build runs in the shared workflow, in a job with no publishing credential.
  # It uses the hashed scripts/build-dist/requirements.txt, which Dependabot
  # updates. To update the file by hand, run in scripts/build-dist:
  #   uv pip compile --no-config --generate-hashes --python-version 3.12 \
  #     --python-platform x86_64-unknown-linux-gnu --exclude-newer "7 days" \
  #     --only-binary :all: --upgrade requirements.in -o requirements.txt
  build:
    permissions:
      contents: read
    uses: meridianlabs-ai/actions/.github/workflows/build-python-dist.yml@378070a4dd5c735a790016981ee144e71ed0b3f3 # main
    with:
      python-version: "3.12"

  publish:
    needs: build
    if: inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required for OIDC/trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect_steward

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
