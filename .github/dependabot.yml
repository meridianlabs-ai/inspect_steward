version: 2
updates:
  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # bumps both. The cooldown gives a compromised release time to be caught
  # before it is proposed; security updates skip it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR per week for every action update, majors included.
    groups:
      github-actions:
        patterns:
          - "*"
  # Bumps uv.lock. The cooldown matches `exclude-newer` in pyproject.toml, and
  # its exclude list matches the "6 hours" entries in `exclude-newer-package`
  # there (a dated emergency entry is locked by hand): Dependabot's cooldown
  # counts whole days, so those packages' 6-hour cooldown is left to uv. They
  # get their own group, so a broken update elsewhere can't hold them up. It
  # comes first because a package that matches both groups goes to the first.
  # inspect-harbor comes from git (`[tool.uv.sources]`), and Dependabot skips
  # a git source that has no `tag`, so it does not update it.
  - package-ecosystem: "uv"
    versioning-strategy: "lockfile-only"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "anthropic"
        - "inspect-ai"
        - "inspect-flow"
        - "inspect-sandboxes"
        - "inspect-scout"
        - "openai"
    groups:
      six-hour-cooldown:
        patterns:
          - "anthropic"
          - "inspect-ai"
          - "inspect-flow"
          - "inspect-sandboxes"
          - "inspect-scout"
          - "openai"
      python-packages:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
  # Bumps the release build toolchain pinned with hashes in
  # scripts/build-dist/requirements.txt.
  - package-ecosystem: "uv"
    directory: "/scripts/build-dist"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      build-toolchain:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
